[project]
name = "persona2vec-gnn"
version = "0.1.0"
description = "Multi-role representation of node embeddings in Graph Neural Network"
authors = [
    {name = "Ashutosh Hathidara, Sadamori Kojaku, Jisung Yoon, Yong-Yeol Ahn"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx (>=3.4.2,<4.0.0)",
    "torch (>=2.6.0,<3.0.0)",
    "torch-geometric (>=2.6.1,<3.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "pydantic (>=2.11.3,<3.0.0)",
    "python-louvain (>=0.16,<0.17)",
    "flake8 (>=7.2.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

